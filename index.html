<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREDBEAR'S FAMILY DINER: NIGHT SHIFT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- MENU SCREEN -->
    <div id="menu" class="screen active center">
        <h1>FREDBEAR'S FAMILY DINER</h1>
        <p class="subtitle">A fan-made night shift at Fredbear's Family Diner.</p>
        <button id="newGame">NEW GAME</button>
        <button id="continueGame">CONTINUE</button>
    </div>

    <!-- OFFICE SCREEN -->
    <div id="office" class="screen">
        <div class="hud">
            <div id="night">Night 1</div>
            <div id="time">12 AM</div>
            <div id="power">Power 100%</div>
        </div>
        <div class="officeScene">
            <!-- LEFT PANEL -->
            <div class="doorPanel">
                <div class="hallGlow" id="leftLightGlow"></div>
                <div class="doorFrame">
                    <div class="metalDoor" id="leftDoorVisual"></div>
                </div>
                <button id="leftLight">LIGHT</button>
                <button id="leftDoor">DOOR: OPEN</button>
            </div>

            <!-- CENTER DESK -->
            <div class="deskArea">
                <div class="poster">FREDBEAR'S<br>FAMILY<br>DINER<br>✦</div>
                <div class="fan">▣ ▤ ◉ ▥</div>
                <div id="status">Survive until 6 AM.</div>
                <button class="monitorButton" id="openCams">RAISE MONITOR</button>
                <div class="usage">USAGE: <span id="usageBars">▮</span></div>
            </div>

            <!-- RIGHT PANEL -->
            <div class="doorPanel">
                <div class="hallGlow" id="rightLightGlow"></div>
                <div class="doorFrame">
                    <div class="metalDoor" id="rightDoorVisual"></div>
                </div>
                <button id="rightLight">LIGHT</button>
                <button id="rightDoor">DOOR: OPEN</button>
            </div>
        </div>
    </div>

    <!-- CAMERA SCREEN -->
    <div id="cams" class="screen">
        <div class="hud">
            <div id="night">Night 1</div>
            <div id="camName">CAM 1 — Main Stage</div>
            <div id="camPower">Power 100%</div>
        </div>
        <div class="cameraScreen">
            <div class="monitorShell">
                <div class="feed" id="feed">MAIN STAGE</div>
                <div id="staticOverlay"></div>
            </div>
        </div>
        <div style="text-align: center;">
            <div class="map">
                <button data-cam="0">CAM 1<br>MAIN STAGE</button>
                <button data-cam="1">CAM 2<br>DINING AREA</button>
                <button data-cam="2">CAM 3<br>PARTY HALL</button>
                <button data-cam="3">CAM 4<br>SAFE ROOM</button>
            </div>
            <button class="monitorButton" id="closeCams">LOWER MONITOR</button>
        </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameOver" class="screen center">
        <div class="scare">👁️</div>
        <h1>GAME OVER</h1>
        <p>The office wasn't secure.</p>
        <button id="retry">RETRY NIGHT</button>
    </div>

    <!-- WIN SCREEN -->
    <div id="win" class="screen center">
        <div class="sixAM">6 AM</div>
        <h1 id="winText">Night 1 complete!</h1>
        <button id="nextNight">NEXT NIGHT</button>
    </div>

    <!-- SCANLINES EFFECT -->
    <div id="scanlines"></div>

    <script src="game.js"></script>
</body>
</html>
